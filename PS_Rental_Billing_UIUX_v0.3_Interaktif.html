 const recentCancel=state.corrections.filter(c=>c.type==='cancel'&&nowT-c.at<=86400000);if(recentCancel.length>=2)a.push({key:'repeated-prep',severity:'warning',title:'Pembatalan billing berulang',detail:recentCancel.length+' pembatalan dalam 24 jam; periksa masa persiapan gratis',at:recentCancel[0].at,section:'audit'});

function consoleCard(c,readonly=false){const bill=calcBill(c),sec=countdown(c),mins=Math.ceil(sec/60),nearly=c.status==='active'&&mins<=state.settings.warn;const prepping=c.status==='active'&&now()<c.prepUntil;const prepSec=prepping?Math.max(0,Math.ceil((c.prepUntil-now())/1000)):0;const cls=c.status==='active'&&nearly?'soon':c.status;const paidSeconds=Math.max(0,sec-Math.ceil(Math.max(0,c.prepUntil-now())/1000));const pct=c.duration?Math.max(0,Math.min(100,100-paidSeconds/(c.duration*60)*100)):0;return `<div class="console-card ${cls}"><div class="con-row"><span class="con-name">PS3-${pad(c.id)}</span><span class="mini">📺 TV ${pad(c.id)} <span class="tag-dot ${c.tv==='on'?'':'red'}"></span></span></div><div class="con-row"><span class="badg ${cls}">${c.status==='available'?'● Tersedia':c.status==='expired'?'● Waktu Habis':prepping?'◷ Persiapan Gratis':nearly?'◉ Hampir Habis':'● Sedang Bermain'}</span><span class="chiplike">TV ${c.tv.toUpperCase()}</span></div>${c.status==='available'?`<div class="lcd" style="padding:25px 8px"><div style="font-size:32px">🎮</div><div class="label">Siap digunakan</div></div>`:`<div class="lcd"><div class="timer" ${prepping?`data-prep="${c.id}"`:`data-timer="${c.id}"`}>${c.status==='expired'?'00:00:00':prepping?countdownText(prepSec):countdownText(sec)}</div><div class="label" data-timer-label="${c.id}">${c.status==='expired'?'Tagihan belum lunas':prepping?`Persiapan gratis · ${c.prepMinutes} menit`:'Sisa waktu bermain'}</div></div><div class="bar ${c.status==='expired'?'red':nearly?'orange':''}"><div style="width:${c.status==='expired'?100:pct}%"></div></div><div class="con-row mini"><span>Paket ${c.duration} menit ${c.prepUntil?'(+ gratis '+c.prepMinutes+'m)':''}</span><b>${money(bill.total)}</b></div>`}<div class="con-actions">${readonly?`<button class="btn ghost full small" data-action="detail" data-id="${c.id}">Lihat Detail</button>`:!state.shiftActive?`<button class="btn ghost full small" disabled>Shift Off · Billing Terkunci</button>`:c.status==='available'?`<button class="btn full" data-action="open-start" data-id="${c.id}">▶ Mulai Billing</button>`:c.status==='active'?`<button class="btn ghost small" data-action="open-pos" data-id="${c.id}">+ Pesanan</button><button class="btn blue small" data-action="extend" data-id="${c.id}">+ Waktu</button><button class="btn warn small" data-action="early-stop" data-id="${c.id}">Selesai</button><button class="btn danger small" data-action="cancel-session" data-id="${c.id}">Batalkan</button>`:`<button class="btn small" data-action="checkout" data-id="${c.id}">Bayar ${money(bill.total)}</button><button class="btn blue small" data-action="extend" data-id="${c.id}">+ Waktu</button><button class="btn danger small" data-action="cancel-session" data-id="${c.id}">Batalkan</button>`}</div></div>`;}

function billing(){return `${header('Billing 6 Konsol PS3','Durasi dan kontrol TV otomatis, tagihan postpaid, serta pesanan pelanggan.','<button class="btn ghost small" data-action="fast" data-minutes="5">⏩ Demo +5 menit</button><button class="btn ghost small" data-action="fast" data-minutes="30">⏩ Demo +30 menit</button>')}${state.shiftActive?`<div class="shiftok"><span>● <b>Shift kasir aktif</b> · Sejak ${fmtFull(currentShift()?.started)} · Operasional billing dan POS diizinkan.</span><button class="btn ghost small" data-action="nav" data-page="shift">Lihat Shift</button></div>`:`<div class="shiftlock">⛔ <b>Shift kasir ditutup.</b> Mulai billing dan POS terkunci. <button class="btn ghost small" data-action="nav" data-page="shift">Buka Shift</button></div>`}<div class="note yellow" style="margin-bottom:16px">⏱ <b>Gratis ${state.settings.prep} menit persiapan:</b> TV menyala sejak tombol Mulai ditekan, tetapi durasi rental berbayar baru dihitung setelah waktu persiapan habis. Perintah TV/ESP32 hanya simulasi.</div><div class="stats">${metric('Total Konsol','6 Unit','6 TV & 6 pengendali ESP32','🎮')}${metric('Sedang Bermain',active().length,'Termasuk masa persiapan','▶')}${metric('Menunggu Bayar',unfinished().length,'TV OFF, tagihan masih terbuka','⏳')}${metric('Tagihan Berjalan',money(unpaid()),'Rental + pesanan belum lunas','🧾')}</div><div class="panel"><div class="panel-title">Status & Billing Konsol <span class="fine">Keenam unit · sinkronisasi timer simulasi</span></div><div class="console-grid">${state.consoles.map(c=>consoleCard(c)).join('')}</div></div>`;}

function logRows(limit=10){const ls=state.logs.slice(0,limit);return ls.length?ls.map(e=>`<div class="list-row"><div><span class="tag-dot ${e.type==='warning'?'orange':e.type==='device'?'blue':''}"></span>${esc(e.text)}</div><span class="fine" style="white-space:nowrap">${fmtTime(e.time)}</span></div>`).join(''):`<div class="fine">Belum ada aktivitas baru. Coba mulai sesi rental.</div>`}
function pos(){const filter=state.posCategory;const productsShown=state.products.filter(p=>(filter==='Semua'||p.cat===filter)&&p.name.toLowerCase().includes(state.posSearch.toLowerCase()));const total=Object.entries(state.ordersCart).reduce((s,[id,qty])=>s+(product(id)?.price||0)*qty,0);return `${header('POS Snack & Minuman','Pilih pelanggan rental atau pembeli umum. Pesanan rental menambah tagihan yang dibayar di akhir.')}${!state.shiftActive?'<div class="shiftlock">⛔ Shift kasir belum aktif; transaksi POS tidak dapat diproses. Buka shift melalui menu Shift & Kas.</div>':'<div class="shiftok">● Shift kasir aktif · Penjualan POS diizinkan.</div>'}<div class="pos-layout"><div class="panel"><div class="filterbar"><input class="text-input" placeholder="Cari makanan atau minuman..." id="prod-search" value="${esc(state.posSearch)}"/><div class="actions">${['Semua','Minuman','Makanan','Snack'].map(x=>`<button class="btn ${state.posCategory===x?'':'ghost'} small" data-action="pos-cat" data-cat="${x}">${x}</button>`).join('')}</div></div><div class="product-grid">${productsShown.map(p=>`<div class="prod-card"><div class="category-icon ${p.cat.toLowerCase()}">${categoryIcon(p.cat)}</div><b>${esc(p.name)}</b><span class="mini">${p.cat} · Stok ${p.stock}${p.stock<=p.min?' ⚠️':''}</span><div class="con-row"><b>${money(p.price)}</b><button class="btn small" data-action="cart-add" data-id="${p.id}" ${!state.shiftActive||p.stock<=0?'disabled':''}>+ Tambah</button></div></div>`).join('')}</div>${productsShown.length?'':'<div class="fine">Produk tidak ditemukan.</div>'}</div><div class="panel sticky-panel"><div class="panel-title">🛒 Keranjang Pesanan</div><div class="field"><label>Masukkan pesanan ke</label><select id="pos-target"><option value="walkin" ${state.posTarget==='walkin'?'selected':''}>Pembeli Umum (langsung bayar)</option>${state.consoles.filter(c=>c.status!=='available').map(c=>`<option value="${c.id}" ${state.posTarget==c.id?'selected':''}>Tagihan PS3-${pad(c.id)} (${c.status==='active'?'Bermain':'Waktu habis'})</option>`).join('')}</select></div><div class="divider"></div>${Object.entries(state.ordersCart).filter(([id,q])=>q>0).map(([id,q])=>{const p=product(id);return `<div class="cartline"><div><b>${esc(p.name)}</b><div class="fine">${money(p.price*q)}</div></div><div class="qty"><button data-action="cart-dec" data-id="${id}">−</button><b>${q}</b><button data-action="cart-add" data-id="${id}">+</button></div></div>`}).join('')||'<p class="fine">Belum ada produk di keranjang.</p>'}<div class="divider"></div><div class="con-row"><b>Total pesanan</b><b style="font-size:23px">${money(total)}</b></div>${state.posTarget==='walkin'?'<p class="fine">Transaksi pembeli umum dibayar sekarang.</p>':'<p class="note">Pilih apakah barang langsung diserahkan atau masih disiapkan; stok berkurang saat diserahkan.</p>'}${state.posTarget==='walkin'?'':`<div class="field"><label>Status penyerahan pesanan</label><select id="pos-fulfillment"><option value="handed">Langsung diserahkan (stok berkurang)</option><option value="preparing">Sedang disiapkan (stok belum berkurang)</option></select></div>`}<button class="btn full" data-action="submit-pos" ${!state.shiftActive||total===0?'disabled':''}>${state.posTarget==='walkin'?'Lanjut ke Pembayaran':'Tambahkan ke Tagihan PS3'}</button><button class="btn ghost full small" style="margin-top:8px" data-action="clear-cart">Kosongkan Keranjang</button></div></div>`;}
function transactions(){const txs=filteredTransactions(), exps=state.role==='owner'?filteredExpenses():[],movement=state.role==='owner'?filteredOwnerMovements():[];const rows=[...txs.map(t=>({kind:'income',time:t.time,t})),...exps.map(e=>({kind:'expense',time:e.at,e})),...movement.map(m=>({kind:'capital',time:m.at,m}))].sort((a,b)=>b.time-a.time);const received=txs.reduce((n,t)=>n+t.amount,0),rent=txs.reduce((n,t)=>n+t.rental,0),pos=txs.reduce((n,t)=>n+t.pos,0),spend=exps.reduce((n,e)=>n+e.value,0);const open=state.consoles.filter(c=>c.status!=='available' && (state.txPeriod==='all'||inTxPeriod(c.started)));return `${header('Riwayat Transaksi','Default hari ini; riwayat tetap tersimpan dan bisa difilter kapan pun.','<button class="btn ghost small" data-action="export">⬇ Unduh CSV</button>')}${periodBar('tx',state.txPeriod,state.txDate)}<div class="stats">${metric('Penerimaan',money(received),getPeriodLabel(state.txPeriod,state.txDate),'💳')}${metric('Rental Terbayar',money(rent),'Tidak termasuk piutang','🎮')}${metric('POS Terbayar',money(pos),'Penjualan snack','🥤')}${metric('Pengeluaran Kas',money(spend),'Non-pendapatan usaha','📤')}</div><div class="panel"><div class="panel-title">Daftar Pembayaran ${state.role==='owner'?'& Kas Keluar':''} <span class="fine">${rows.length} catatan · ${getPeriodLabel(state.txPeriod,state.txDate)}</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Waktu</th><th>Jenis</th><th>Rincian</th><th>Total</th><th>Metode Pembayaran</th><th>Shift Penerima</th><th>Shift Pembuat</th><th>Status</th></tr></thead><tbody>${rows.map(r=>r.kind==='income'?`<tr><td><b>${esc(r.t.id)}</b></td><td>${fmtFull(r.t.time)}</td><td>${esc(r.t.type)}</td><td>${esc(r.t.label)}</td><td><b class="accent">+${money(r.t.amount)}</b></td><td>${esc(r.t.method)}</td><td>${shiftLabel(r.t.shiftId)}</td><td>${shiftLabel(r.t.originShiftId)}</td><td>${badgeStatus('Lunas')}</td></tr>`:r.kind==='expense'?`<tr style="background:#fff9f5"><td>EXP-${r.e.id||state.expense.indexOf(r.e)+1}</td><td>${fmtFull(r.e.at)}</td><td>Pengeluaran</td><td>${esc(r.e.name)} · ${esc(r.e.category||'Lainnya')}</td><td class="redtxt"><b>−${money(r.e.value)}</b></td><td>Tunai keluar</td><td>${shiftLabel(r.e.shiftId)}</td><td>—</td><td>${badgeStatus('Dicatat','soon')}</td></tr>`:`<tr style="background:#f1faff"><td>MOD-${r.m.id}</td><td>${fmtFull(r.m.at)}</td><td>${r.m.kind==='setoran'?'Setoran Modal':r.m.kind==='prive'?'Prive Owner':'Mutasi ke Bank'}</td><td>${esc(r.m.note)}</td><td>${r.m.kind==='setoran'?'+':'−'}${money(r.m.amount)}</td><td>${esc(r.m.method)}</td><td>${shiftLabel(r.m.shiftId)}</td><td>Owner</td><td>${badgeStatus('Non-Pendapatan','active')}</td></tr>`).join('')||'<tr><td colspan="9" class="fine">Tidak ada transaksi pada periode tersebut.</td></tr>'}${open.map(c=>`<tr><td>SESI-${pad(c.id)}</td><td>${fmtFull(c.started)}</td><td>Postpaid</td><td>PS3 ${pad(c.id)} · belum lunas</td><td><b>${money(calcBill(c).total)}</b></td><td>—</td><td>Belum ada</td><td>${shiftLabel(c.originShiftId)}</td><td>${badgeStatus('Belum Lunas','expired')}</td></tr>`).join('')}</tbody></table></div></div><div class="note sectionspace">Omzet dan kas masuk di atas mengikuti <b>tanggal pembayaran</b>. Transaksi yang dibuat karyawan tetapi dilunasi owner menunjukkan dua shift berbeda, tanpa menggandakan penerimaan. Setoran modal/prive tidak dihitung sebagai penjualan.</div>`;}

function shift(){const sh=state.shiftRecords.filter(s=>s.employee==='Kasir Demo').slice(-1)[0],d=sh?shiftSummary(sh.id):{payments:[],expenses:[],opening:0,cash:0,qris:0,transfer:0,out:0,drawer:0,total:0};return `${header('Shift & Kas','Serah terima penjaga; uang fisik dihitung terlebih dahulu saat menutup shift.')}<div class="stats">${metric('Shift Karyawan',state.shiftActive?'● AKTIF':'● NONAKTIF',state.shiftActive?'Billing dan POS terbuka':'Operasional dilanjutkan owner','◷')}${metric('Mulai Shift',sh?fmtTime(sh.started):'—',sh?fmtDate(sh.started):'Belum ada','🕘')}${metric('Tutup Shift',sh?.ended?fmtTime(sh.ended):'—',sh?.ended?fmtDate(sh.ended):'Belum ditutup','🕔')}${metric('Transaksi Shift',d.payments.length+' transaksi','Lunas selama shift kasir','🧾')}</div><div class="cols-2"><div class="panel"><div class="panel-title">Aktivitas Shift Karyawan</div><div class="list-row"><span>Penjaga</span><b>${state.shiftActive?'Kasir Demo':'Owner Demo'}</b></div><div class="list-row"><span>Shift kasir mulai (ON)</span><b>${fmtFull(sh?.started)}</b></div><div class="list-row"><span>Shift kasir selesai (OFF)</span><b>${fmtFull(sh?.ended)}</b></div><div class="list-row"><span>Jadwal rencana karyawan</span><b>09.00–17.00</b></div><div class="list-row"><span>Pengganti</span><b>Owner · 17.00–00.00</b></div><button class="btn full ${state.shiftActive?'warn':''}" data-action="toggle-shift" style="margin-top:14px">${state.shiftActive?'■ Tutup Shift · Hitung Kas Fisik':'▶ Buka Shift Karyawan Baru'}</button><div class="note yellow" style="margin-top:12px">Tutup shift tidak menghentikan timer PS3 yang sedang berjalan. Transaksi lintas shift akan menampilkan pembuat sesi dan penerima pembayaran secara terpisah.</div></div><div class="panel"><div class="panel-title">Aktivitas Finansial ${sh?'Shift #'+sh.id:''}</div><div class="list-row"><span>Pembayaran tunai</span><b>${money(d.cash)}</b></div><div class="list-row"><span>QRIS (non-tunai)</span><b>${money(d.qris)}</b></div><div class="list-row"><span>Transfer bank</span><b>${money(d.transfer)}</b></div><div class="list-row"><span>Kas keluar</span><b class="redtxt">${money(d.out)}</b></div><div class="list-row"><span>Kas fisik terakhir dilaporkan</span><b>${sh?.countedTotal!=null?money(sh.countedTotal):'Belum ditutup'}</b></div><button class="btn ghost full" data-action="add-expense" ${!state.shiftActive?'disabled':''}>+ Catat Pengeluaran Kas</button>${sh?.ended?`<div class="note sectionspace">Setelah dihitung, saldo teoritis ${money(getCashExpected(sh))}. Selisih ${money(sh.cashDiff||0)}. Temuan dapat dilihat owner.</div>`:'<div class="note sectionspace">Saldo kas seharusnya tidak ditampilkan saat input hitung fisik (blind cash count).</div>'}</div></div>`;}

function activity(){return `${header('Audit & Aktivitas','Log perubahan billing, pengiriman perintah TV, penambahan snack, dan pembayaran.')}<div class="panel"><div class="panel-title">Riwayat Kejadian Demo</div>${logRows(70)}</div>`;}
function overview(){const tx=state.transactions.filter(t=>isInPeriod(t.time,'today')),expenses=state.expense.filter(e=>isInPeriod(e.at,'today')),received=tx.reduce((a,t)=>a+t.amount,0),rent=tx.reduce((a,t)=>a+t.rental,0),pos=tx.reduce((a,t)=>a+t.pos,0),exp=expenses.reduce((a,e)=>a+e.value,0),rows=trendData(),max=Math.max(1,...rows.map(r=>r.amount)),tot=rows.reduce((a,r)=>a+r.amount,0),period=state.trendPeriod,alerts=auditItems().filter(x=>state.auditReviews[x.key]!=='resolved');return `${header('Dashboard Owner','Ringkasan hari ini dan kejadian yang perlu perhatian.','<button class="btn ghost small" data-action="switch-role">Lihat Kasir →</button>')}<div class="stats">${metric('Kas Diterima Hari Ini',money(received),'Tunai + QRIS + transfer','💰')}${metric('Rental Hari Ini',money(rent),'Pembayaran rental hari ini','🎮')}${metric('POS Hari Ini',money(pos),'Penjualan snack terbayar','🛍️')}${metric('Tagihan Terbuka',money(unpaid()),'Seluruh sesi belum lunas','📋')}</div><div class="two-col"><div class="panel"><div class="panel-title"><span>Tren Pendapatan <span class="fine">· ${period==='hari'?'7 hari':period==='bulan'?'12 bulan':'5 tahun'}</span></span><div class="chartfilter">${[['hari','Hari'],['bulan','Bulan'],['tahun','Tahun']].map(([k,l])=>`<button class="${period===k?'selected':''}" data-action="trend-period" data-period="${k}">${l}</button>`).join('')}</div></div><div class="fine">Total pembayaran yang diterima pada periode grafik</div><h2 style="margin:7px 0 22px">${money(tot)}</h2><div class="bar-chart">${rows.map(r=>`<div class="${r.amount?'':'emptybar'}" style="height:${r.amount?Math.max(7,r.amount/max*100):3}%" title="${esc(r.label)}: ${money(r.amount)}"><small>${r.amount?Math.round(r.amount/1000)+'K':'0'}</small></div>`).join('')}</div><div class="chartlabels">${rows.map(r=>`<span>${esc(r.label)}</span>`).join('')}</div></div><div class="panel"><div class="panel-title">Status Operasional <span class="fine">Timer live per detik</span></div>${state.consoles.map(c=>`<div class="list-row"><span><b>PS3 ${pad(c.id)}</b> <span class="fine">· TV ${c.tv.toUpperCase()}</span></span><span class="badg ${c.status==='expired'?'expired':c.status==='active'?'active':'available'}">${c.status==='available'?'Tersedia':c.status==='active'?`<span data-timer="${c.id}">${countdownText(countdown(c))}</span>`:'Menunggu Bayar'}</span></div>`).join('')}<button class="btn ghost full small" data-action="nav" data-page="monitoring" style="margin-top:12px">Buka Monitoring →</button></div></div><div class="panel sectionspace"><div class="panel-title">Audit yang Perlu Perhatian <button class="btn ghost small" data-action="nav" data-page="audit">Buka Audit Lengkap →</button></div><div class="audit-grid"><div class="audit-card"><div class="fine">Temuan belum selesai</div><div class="audit-num ${alerts.length?'redtxt':'accent'}">${alerts.length}</div></div><div class="audit-card"><div class="fine">Pengeluaran hari ini</div><div class="audit-num">${money(exp)}</div></div><div class="audit-card"><div class="fine">Shift kasir</div><div class="audit-num" style="font-size:16px">${state.shiftActive?'● ON':'● OFF'}</div></div></div>${alerts.slice(0,3).map(a=>`<div class="list-row"><span>${a.severity==='critical'?'🔴':'🟠'} ${esc(a.title)}</span><button class="btn ghost small" data-action="nav" data-page="audit">Tinjau →</button></div>`).join('')||'<div class="note">Tidak ada temuan aktif yang membutuhkan perhatian.</div>'}</div>`;}

function monitoring(){return `${header('Monitoring Rental','Pantau enam PS3, status TV dan tagihan pelanggan tanpa mengganggu kasir.')}<div class="stats">${metric('Aktif',active().length,'Sedang bermain','▶')}${metric('Menunggu Pembayaran',unfinished().length,'Waktu sudah habis','🧾')}${metric('Tersedia',state.consoles.filter(c=>c.status==='available').length,'Bisa disewa','✅')}${metric('Outstanding',money(unpaid()),'Belum diterima','⌛')}</div><div class="panel"><div class="console-grid">${state.consoles.map(c=>consoleCard(c,true)).join('')}</div></div>`;}
function finance(){const grossPos=posSales()-state.transactions.reduce((s,t)=>s+t.cogs,0);const expTotal=state.expense.reduce((s,e)=>s+e.value,0),cats=['Bahan & Persediaan','Perawatan','Operasional','Lainnya'];const example=[{name:'Rental PS3 (lunas)',v:rentalSales()},{name:'Penjualan produk (lunas)',v:posSales()},{name:'HPP produk terjual',v:-state.transactions.reduce((s,t)=>s+t.cogs,0)},{name:'Pengeluaran kas yang dicatat',v:-expTotal}];return `${header('Keuangan & Analitik','Pisahkan omzet, HPP produk dan pengeluaran kas; laba bersih belum dihitung penuh.','<button class="btn ghost small" data-action="export">⬇ Ekspor transaksi CSV</button>')}<div class="stats">${metric('Total Kas Masuk',money(sold()),'Penjualan terbayar','💳')}${metric('Laba Kotor POS',money(grossPos),'Penjualan POS − HPP POS','🛍️')}${metric('Tagihan Belum Lunas',money(unpaid()),'Tidak dihitung sebagai kas','🧾')}${metric('Total Pengeluaran',money(expTotal),'Pengeluaran tunai tercatat','📤')}</div><div class="cols-2"><div class="panel"><div class="panel-title">Ringkasan per Kategori</div>${example.map(x=>`<div class="list-row"><span>${x.name}</span><b class="${x.v<0?'redtxt':''}">${x.v<0?'−':''}${money(Math.abs(x.v))}</b></div>`).join('')}<div class="note yellow" style="margin-top:15px"><b>Bukan laba bersih.</b> Biaya listrik, gaji, sewa, pajak, penyusutan, dan COGS rental belum lengkap. Pengeluaran kas bahan persediaan tidak otomatis sama dengan HPP barang yang sudah terjual.</div></div><div class="panel"><div class="panel-title">Rincian Sumber Pendapatan</div><div style="display:flex;gap:6px;height:24px;border-radius:8px;overflow:hidden;background:#edf2f2"><div style="width:${sold()?rentalSales()/sold()*100:0}%;background:#087f78"></div><div style="flex:1;background:#e3a254"></div></div><div class="list-row"><span><span class="tag-dot"></span> Rental PS3</span><b>${money(rentalSales())} · ${sold()?Math.round(rentalSales()/sold()*100):0}%</b></div><div class="list-row"><span><span class="tag-dot orange"></span> Snack & Minuman</span><b>${money(posSales())} · ${sold()?Math.round(posSales()/sold()*100):0}%</b></div><div class="note" style="margin-top:16px">Pendapatan ditampilkan setelah pembayaran diterima, sedangkan tagihan terbuka belum menjadi kas masuk.</div></div></div><div class="panel sectionspace"><div class="panel-title">Produktivitas Konsol · Sesi Terbayar</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Unit</th><th>Sesi Lunas</th><th>Jam Terjual</th><th>Omzet Rental</th><th>Estimasi listrik aktif</th><th>Kontribusi sebelum biaya tetap*</th></tr></thead><tbody>${state.consoles.map(c=>{const tx=state.transactions.filter(t=>t.consoleId===c.id),revenue=tx.reduce((v,t)=>v+t.rental,0),hours=tx.reduce((v,t)=>v+(t.duration||0)/60,0),elec=hours*0.15*1444.7;return `<tr><td><b>PS3 ${pad(c.id)}</b></td><td>${tx.length}</td><td>${hours.toFixed(1)} jam</td><td>${money(revenue)}</td><td>${money(elec)}</td><td>${money(revenue-elec)}</td></tr>`}).join('')}</tbody></table></div><div class="note yellow sectionspace">*Kontribusi bukan laba bersih per konsol. Belum ada alokasi sewa, gaji, penyusutan, dan perawatan. Daya aktif diasumsikan 150 watt per set sampai ada pengukuran aktual.</div></div><div class="panel sectionspace"><div class="panel-title">Pola Sesi Menurut Jam Mulai</div><div class="simple-bars">${Array.from({length:15},(_,i)=>{const h=i+9,n=state.transactions.filter(t=>t.consoleId&&new Date(t.startedAt||t.time).toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hour12:false}).startsWith(String(h).padStart(2,'0'))).length;return `<div class="col" title="Pukul ${h}:00 · ${n} sesi mulai" style="height:${Math.max(6,n*25)}%"></div>`}).join('')}</div><div class="fine">09.00–23.00 · berdasarkan waktu sesi dimulai, bukan okupansi per jam. Data demo masih terbatas.</div></div><div class="panel sectionspace"><div class="panel-title">Ringkasan Sumber Pengeluaran <span class="fine">Berdasarkan catatan kas keluar</span></div>${cats.map(cat=>{const v=state.expense.filter(e=>(e.category||'Lainnya')===cat).reduce((a,e)=>a+e.value,0);return `<div class="con-row"><span>${esc(cat)}</span><b>${money(v)} ${expTotal?`<span class="fine">(${Math.round(v/expTotal*100)}%)</span>`:''}</b></div><div class="exp-bar"><div style="width:${expTotal?v/expTotal*100:0}%"></div></div>`}).join('')}<div class="list-row"><b>Total pengeluaran kas tercatat</b><b class="redtxt">${money(expTotal)}</b></div><div class="note yellow" style="margin-top:12px">Ini ringkasan arus kas keluar, bukan seluruh beban akuntansi. Biaya produk terjual (HPP) ditampilkan terpisah agar tidak dihitung ganda.</div></div>`;}

function auditPage(){const alerts=auditItems(),filtered=alerts.filter(a=>isInPeriod(a.at,state.auditPeriod,state.auditDate)||a.at===now()),open=alerts.filter(a=>state.auditReviews[a.key]!=='resolved'),critical=open.filter(a=>a.severity==='critical').length,sh=state.shiftRecords.slice().reverse();const adjustments=state.corrections.filter(e=>isInPeriod(e.at,state.auditPeriod,state.auditDate));const cmds=state.logs.filter(e=>e.type==='device').slice(0,10);const pending=state.pendingExpenses;const close=state.dayClosures[0];return `${header('Audit & Pengawasan','Satu tempat untuk temuan, rekonsiliasi kas, pembatalan, persetujuan, dan tutup hari.','<button class="btn" data-action="day-close">✓ Tutup Hari</button>')}<div class="stats">${metric('Temuan Terbuka',open.length,'Perlu diselesaikan owner','🛡️')}${metric('Kritis',critical,'Didahulukan','🚨')}${metric('Pengajuan Kas',pending.length,'Menunggu persetujuan','🧾')}${metric('Tutup Hari',state.dayClosures.length,close?'Terakhir '+fmtDate(close.at):'Belum ada','📅')}</div>${periodBar('audit',state.auditPeriod,state.auditDate)}<div class="cols-2"><div class="panel"><div class="panel-title">Temuan Otomatis <span class="fine">${open.length} belum selesai</span></div>${filtered.length?filtered.map(a=>`<div class="audit-item ${a.severity} ${state.auditReviews[a.key]==='resolved'?'resolved':''}"><div class="flex-between"><b>${esc(a.title)}</b><span class="alert-tag ${a.severity}">${a.severity==='critical'?'Kritis':a.severity==='warning'?'Perlu ditinjau':'Informasi'}</span></div><div class="fine" style="margin:7px 0">${esc(a.detail)}</div><div class="flex-between"><span class="fine">${fmtFull(a.at)} · ${state.auditReviews[a.key]==='resolved'?'Selesai':'Belum ditinjau'}</span><div class="actions">${state.auditReviews[a.key]==='resolved'?`<button class="btn ghost small" data-action="audit-reopen" data-key="${esc(a.key)}">Buka Lagi</button>`:`<button class="btn small" data-action="audit-resolve" data-key="${esc(a.key)}">Tandai Selesai</button>`}</div></div></div>`).join(''):'<div class="note">Tidak ada temuan otomatis pada periode ini.</div>'}<p class="fine">Temuan bukan bukti kecurangan. Owner perlu meninjau konteks sebelum menyelesaikannya.</p></div><div class="panel"><div class="panel-title">Persetujuan Pengeluaran</div>${pending.map(e=>`<div class="audit-item warning"><div class="flex-between"><b>${esc(e.name)}</b><b class="redtxt">${money(e.value)}</b></div><div class="fine">${esc(e.actor)} · ${shiftLabel(e.shiftId)} · ${fmtFull(e.at)}</div><div class="fine">Bukti: ${esc(e.proof||'Tidak ada')}</div><div class="actions" style="margin-top:12px"><button class="btn small" data-action="approve-expense" data-id="${e.id}">Setujui</button><button class="btn danger small" data-action="reject-expense" data-id="${e.id}">Tolak</button></div></div>`).join('')||'<div class="note">Tidak ada pengajuan pengeluaran yang menunggu persetujuan.</div>'}<div class="divider"></div><div class="panel-title">Aksi Owner</div><div class="actions"><button class="btn ghost small" data-action="owner-money">+ Setoran / Prive / Mutasi</button><button class="btn ghost small" data-action="stock-adjust">Koreksi Stok</button></div><div class="note yellow" style="margin-top:14px">Setoran modal, prive, dan mutasi ke bank memengaruhi uang kas tetapi <b>bukan omzet atau biaya usaha</b>. Koreksi stok wajib punya alasan.</div></div></div><div class="panel sectionspace"><div class="panel-title">Rekonsiliasi dan Jejak Shift <span class="fine">Karyawan digantikan langsung oleh owner</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Penjaga / Shift</th><th>ON</th><th>OFF</th><th>Kas Awal</th><th>Tunai Masuk</th><th>QRIS</th><th>Transfer</th><th>Kas Keluar</th><th>Kas Teoritis</th><th>Kas Fisik</th><th>Selisih</th><th>Verifikasi Owner</th></tr></thead><tbody>${sh.map(x=>{const d=shiftSummary(x.id),theory=getCashExpected(x);return `<tr><td><b>${esc(x.employee)}</b><div class="fine">#${x.id}</div></td><td>${fmtFull(x.started)}</td><td>${fmtFull(x.ended)}</td><td>${money(d.opening)}</td><td>${money(d.cash)}</td><td>${money(d.qris)}</td><td>${money(d.transfer)}</td><td>${money(d.out)}</td><td>${money(theory)}</td><td>${x.countedTotal!=null?money(x.countedTotal):'—'}</td><td class="${x.cashDiff!==0&&x.cashDiff!=null?'redtxt':''}">${x.cashDiff!=null?money(x.cashDiff):'—'}</td><td>${x.verifiedAt?'✓ '+fmtFull(x.verifiedAt):x.ended?`<button class="btn small" data-action="verify-shift" data-id="${x.id}">Konfirmasi Diterima</button>`:'Belum tutup'}</td></tr>`}).join('')}</tbody></table></div><div class="note sectionspace">Penerimaan mengikuti <b>shift penerima pembayaran</b>, sedangkan sesi menyimpan <b>shift pembuat</b>. QRIS dan transfer tidak menambah kas fisik di laci.</div></div><div class="cols-2 sectionspace"><div class="panel"><div class="panel-title">Riwayat Koreksi & Aktivitas</div><div class="timeline">${adjustments.slice(0,15).map(e=>`<div class="event"><b>${esc(e.detail)}</b><div class="fine">${fmtFull(e.at)} · ${esc(e.role)} · ${shiftLabel(e.shiftId)}</div></div>`).join('')||'<div class="fine">Belum ada koreksi untuk periode ini.</div>'}</div></div><div class="panel"><div class="panel-title">Riwayat Tutup Hari</div>${state.dayClosures.map((d,i)=>`<div class="audit-item"><b>${esc(d.businessDate)}</b> <span class="badg available">Final</span><div class="fine">Ditutup ${fmtFull(d.at)} · ${esc(d.actor)}</div><div class="list-row"><span>Kas masuk</span><b>${money(d.received)}</b></div><div class="list-row"><span>Pengeluaran tercatat</span><b>${money(d.spending)}</b></div><div class="list-row"><span>Tagihan terbuka saat tutup</span><b>${money(d.unpaid)}</b></div></div>`).join('')||'<div class="note">Belum ada laporan akhir hari. Owner dapat membuat snapshot yang tidak berubah ketika transaksi berikutnya ditambahkan.</div>'}<div class="divider"></div><div class="panel-title">Perintah Hardware Terakhir</div>${cmds.map(e=>`<div class="list-row"><span>${esc(e.text)}</span><span class= function settings(){return `${header('Pengaturan Rental','Kebijakan tarif dan notifikasi timer yang dipakai dalam simulasi.')}<div class="cols-2"><div class="panel"><div class="panel-title">Konfigurasi Billing</div><div class="field"><label>Tarif per jam (Rp)</label><input type="number" min="500" step="500" id="set-rate" value="${state.settings.rate}"></div><div class="field"><label>Peringatan waktu hampir habis (menit)</label><input type="number" min="1" max="30" id="set-warn" value="${state.settings.warn}"></div><div class="field"><label>Waktu persiapan gratis (menit)</label><input type="number" min="0" max="20" id="set-prep" value="${state.settings.prep}"></div><button class="btn" data-action="save-settings">Simpan Pengaturan</button><div class="note" style="margin-top:14px">Harga rental disimpan sebagai nilai sesi ketika dimulai. Pengubahan tarif baru tidak mengubah sesi aktif dan riwayat sebelumnya dalam versi produksi.</div></div><div class="panel"><div class="panel-title">Aturan Bisnis</div>${[['Metode pembayaran','Postpaid · Bayar di akhir'],['Persiapan gratis',state.settings.prep+' menit sebelum paket berbayar'],['Saat timer habis','TV OFF otomatis (simulasi)'],['Pesanan snack','Masuk tagihan PS; stok turun saat diserahkan'],['Tambah waktu','TV ON jika sebelumnya OFF'],['Unit tersedia kembali','Setelah pembayaran diterima']].map(a=>`<div class="list-row"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}<button class="btn danger full" style="margin-top:16px" data-action="reset-demo">Reset Demo ke Awal</button></div></div>`;}
const verifyPaymentBlock=()=>`<div class="note yellow" id="verify-online"><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="verified-payment" style="width:17px;height:17px"> Saya sudah mengecek pembayaran benar-benar diterima di aplikasi penyedia QRIS/bank.</label><span class="fine">Untuk demo, ini konfirmasi manual. Screenshot pelanggan saja bukan bukti final.</span></div>`;
const cashTenderBlock=total=>`<div class="cashbox" id="cash-tender" data-total="${total}"><div class="field" style="margin:0 0 10px"><label>Uang tunai yang diberikan pelanggan</label><input id="cash-given" type="number" min="0" step="500" inputmode="numeric" placeholder="Contoh: 50000"></div><div class="cashoptions">${[total,20000,50000,100000].filter((x,i,a)=>x>=total&&a.indexOf(x)===i).map(x=>`<button type="button" data-action="cash-quick" data-value="${x}">${money(x)}</button>`).join('')}</div><div class="divider"></div><div class="con-row"><b>Kembalian otomatis</b><div class="value" id="cash-change">Rp 0</div></div><div class="fine" id="cash-feedback">Masukkan nominal yang diterima.</div></div>`;
const refreshCash=()=>{const sel=document.getElementById('pay-method'),box=document.getElementById('cash-tender'),inp=document.getElementById('cash-given'),change=document.getElementById('cash-change'),feedback=document.getElementById('cash-feedback');if(!sel||!box)return;const cash=sel.value==='Tunai';box.classList.toggle('hidden',!cash);const verify=document.getElementById('verify-online');if(verify)verify.classList.toggle('hidden',cash);if(!cash)return;const due=Number(box.dataset.total),given=Number(inp?.value||0);if(change){change.textContent=money(Math.max(0,given-due));change.classList.toggle('danger',given<due);}if(feedback)feedback.textContent=given===0?'Masukkan nominal yang diterima.':given<due?`Kurang ${money(due-given)} — pembayaran belum bisa disahkan.`:`Uang cukup. Kembalian ${money(given-due)}.`;};
const validateCash=total=>{if(document.getElementById('pay-method').value!=='Tunai')return {ok:true,received:total,change:0};const received=Number(document.getElementById('cash-given')?.value||0);if(received<total)return {ok:false};return {ok:true,received,change:received-total};};
function renderModal(){const m=state.modal;const c=m.id?findC(m.id):null;const bill=c?calcBill(c):null;let title='',body='',footer='';if(m.kind==='start'){title=`Mulai Billing PS3-${pad(c.id)}`;body=`<div class="note">▶ TV ${pad(c.id)} ON saat tombol Mulai ditekan. <b>${state.settings.prep} menit pertama gratis untuk memilih dan menyiapkan game.</b> Setelah itu barulah durasi paket berbayar berjalan. Bayar di akhir.</div><div class="field"><label>Nama pelanggan (opsional)</label><input id="customer" placeholder="Contoh: Pelanggan A"></div><div class="field"><label>Durasi paket</label><select id="duration"><option value="30">30 menit — ${money(state.settings.rate/2)}</option><option value="60">1 jam — ${money(state.settings.rate)}</option><option value="120" selected>2 jam — ${money(state.settings.rate*2)}</option><option value="180">3 jam — ${money(state.settings.rate*3)}</option><option value="240">4 jam — ${money(state.settings.rate*4)}</option></select></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-start" data-id="${c.id}">▶ Mulai Timer + TV ON</button>`;}

else if(m.kind==='extend'){title=`Tambah Waktu PS3-${pad(c.id)}`;body=`<div class="note">Jika timer sudah habis, TV akan disimulasikan menyala kembali. Biaya tambahan masuk tagihan yang belum dibayar.</div><div class="field"><label>Tambahan durasi</label><select id="extend-minutes"><option value="30">30 menit — ${money(c.rate/2)}</option><option value="60" selected>1 jam — ${money(c.rate)}</option><option value="120">2 jam — ${money(c.rate*2)}</option></select></div><div class="receipt-row"><span>Tagihan saat ini</span><b>${money(bill.total)}</b></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-extend" data-id="${c.id}">+ Tambah Waktu</button>`;}
else if(m.kind==='checkout'||m.kind==='detail'){title=`Rincian Tagihan PS3-${pad(c.id)}`;body=`<div class="con-row"><span class="badg ${c.status==='active'?'active':c.status==='expired'?'expired':'available'}">${c.status==='active'?'Masih bermain':c.status==='expired'?'Waktu habis':'Tersedia'}</span><span class="mini">${esc(c.customer)}</span></div><div class="divider"></div><div class="receipt-row"><span>Rental PS3 ${pad(c.id)} (${c.duration} menit)</span><b>${money(bill.rental)}</b></div>${c.orders.map(o=>`<div class="receipt-row"><span>${esc(product(o.pid)?.name||'Produk')} × ${o.qty} <span class="fine">${o.status==='preparing'?'· ⏳ Disiapkan':'· ✓ Diserahkan'}</span></span><b>${money(o.price*o.qty)}</b></div>${o.status==='preparing'?`<div class="con-row"><button class="btn ghost small" data-action="handover-pos" data-id="${c.id}" data-order="${o.orderId}">✓ Serahkan</button><button class="btn danger small" data-action="cancel-pos-pending" data-id="${c.id}" data-order="${o.orderId}">Batalkan item</button></div>`:state.role==='owner'?`<div class="con-row"><span class="fine">Sudah diserahkan · koreksi hanya owner</span><button class="btn danger small" data-action="correct-item" data-id="${c.id}" data-order="${o.orderId}">Koreksi</button></div>`:''}`).join('')}${c.discount?`<div class="receipt-row"><span>Diskon disetujui owner</span><b>−${money(c.discount)}</b></div>`:``}<div class="hr"></div><div class="receipt-row"><b>TOTAL TAGIHAN</b><b class="receipt-total">${money(bill.total)}</b></div><div class="note yellow">${c.status==='active'?'Jika dibayar sekarang, sesi dihentikan dan TV diperintahkan OFF.':'TV telah diminta OFF; tagihan tetap terbuka sampai lunas.'}</div>${m.kind==='checkout'?`<div class="field"><label>Metode pembayaran</label><select id="pay-method"><option value="Tunai">Tunai</option><option value="QRIS">QRIS (konfirmasi manual)</option><option value="Transfer">Transfer (konfirmasi manual)</option></select></div>${cashTenderBlock(bill.total)}${verifyPaymentBlock()}`:''}`;footer=m.kind==='checkout'?`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-checkout" data-id="${c.id}">✓ Catat Lunas ${money(bill.total)}</button>`:`${state.role==='owner'?`<button class="btn ghost" data-action="discount" data-id="${c.id}">Atur Diskon</button>`:''}<button class="btn" data-action="close-modal">Tutup</button>`;}
else if(m.kind==='retail-pay'){const tot=Object.entries(state.ordersCart).reduce((s,[id,q])=>s+product(id).price*q,0);title='Pembayaran Pembeli Umum';body=`<div class="note">Transaksi snack tanpa rental PS3. Stok akan dikurangi setelah pembayaran dicatat.</div>${Object.entries(state.ordersCart).filter(([id,q])=>q).map(([id,q])=>`<div class="receipt-row"><span>${esc(product(id).name)} ×${q}</span><b>${money(product(id).price*q)}</b></div>`).join('')}<div class="hr"></div><div class="receipt-row"><b>Total</b><b class="receipt-total">${money(tot)}</b></div><div class="field"><label>Metode pembayaran</label><select id="pay-method"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select></div>${cashTenderBlock(tot)}${verifyPaymentBlock()}`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-retail">✓ Terima Pembayaran</button>`;}

else if(m.kind==='restock'){const p=product(m.id);title=`Restock ${esc(p.name)}`;body=`<div class="note">Stok saat ini: ${p.stock} unit. Restock tercatat dalam demo persediaan.</div><div class="field"><label>Jumlah stok masuk</label><input id="restock-count" type="number" min="1" value="10"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-restock" data-id="${p.id}">+ Tambah Stok</button>`;}
else if(m.kind==='product'){const p=m.id?product(m.id):null;title=p?'Ubah Produk':'Tambah Produk Baru';body=`<div class="field"><label>Nama produk</label><input id="prd-name" value="${p?esc(p.name):''}" placeholder="Nama produk"></div><div class="field"><label>Kategori</label><select id="prd-cat">${['Minuman','Snack','Makanan'].map(x=>`<option ${p?.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="cols-2"><div class="field"><label>Harga Jual</label><input id="prd-price" type="number" value="${p?.price||5000}"></div><div class="field"><label>HPP Satuan</label><input id="prd-cost" type="number" value="${p?.cost||2500}"></div></div><div class="field"><label>Stok Saat Ini</label><input id="prd-stock" type="number" value="${p?.stock??10}"></div><div class="field"><label>Tanggal kedaluwarsa (jika ada)</label><input type="date" id="prd-exp" value="${esc(p?.expires||'')}"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="confirm-product" data-id="${m.id||0}">Simpan Produk</button>`;}
else if(m.kind==='blindcash'){const ds=[100000,50000,20000,10000,5000,2000,1000,500,200,100];title='Tutup Shift · Hitung Uang Fisik';body=`<div class="note yellow"><b>Blind Cash Counting:</b> hitung uang yang ada secara fisik tanpa melihat saldo seharusnya. Hasil pertama tersimpan untuk audit. Karyawan menyerahkan kas kepada owner setelah OFF.</div><div class="denomgrid" id="denom-list">${ds.map(v=>`<div class="denom flex-between"><div><b>${money(v)}</b><div class="denomlabel">Pecahan uang</div></div><input type="number" data-denom="${v}" min="0" step="1" value="0" aria-label="Jumlah pecahan ${v}"></div>`).join('')}</div><div class="divider"></div><div class="flex-between"><b>Total uang fisik dihitung</b><b class="accent" id="blind-total">Rp 0</b></div><div class="field"><label>Catatan serah terima (opsional)</label><input id="cash-note" placeholder="Contoh: uang receh dihitung bersama owner"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Kembali</button><button class="btn" data-action="confirm-blindcash">Kirim Hasil & Tutup Shift</button>`;}
else if(m.kind==='owner-money'){title='Mutasi Uang Owner';body=`<div class="note">Setoran modal, prive pribadi, atau pemindahan ke bank <b>tidak dianggap penjualan maupun biaya usaha</b>.</div><div class="field"><label>Jenis transaksi</label><select id="om-kind"><option value="setoran">Setoran modal owner (kas masuk)</option><option value="prive">Prive pribadi (kas keluar)</option><option value="bank">Setor tunai ke rekening bank (kas keluar)</option></select></div><div class="field"><label>Nominal (Rp)</label><input id="om-value" type="number" min="1" value="100000"></div><div class="field"><label>Keterangan</label><input id="om-note" placeholder="Alasan atau catatan" value="Setoran modal operasional"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Kembali</button><button class="btn" data-action="save-owner-money">Simpan Mutasi</button>`;}
else if(m.kind==='dayclose'){const d=businessDay(now()),tx=state.transactions.filter(t=>businessDay(t.time)===d),ex=state.expense.filter(e=>businessDay(e.at)===d);title='Konfirmasi Tutup Hari Bisnis';body=`<div class="note">Laporan final disimpan sebagai <b>snapshot</b>, bukan angka yang berubah setiap kali transaksi diperbarui. Hari bisnis dimulai pukul 09.00 WIB.</div><div class="list-row"><span>Hari bisnis</span><b>${d}</b></div><div class="list-row"><span>Pembayaran diterima</span><b>${money(tx.reduce((v,t)=>v+t.amount,0))}</b></div><div class="list-row"><span>Pengeluaran kas</span><b>${money(ex.reduce((v,e)=>v+e.value,0))}</b></div><div class="list-row"><span>Tagihan saat ini belum lunas</span><b>${money(unpaid())}</b></div><div class="field"><label>Catatan owner</label><input id="dayclose-note" placeholder="Opsional"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Kembali</button><button class="btn" data-action="confirm-day-close">Finalkan Tutup Hari</button>`;}
else if(m.kind==='correct-item'){const o=c?.orders.find(x=>String(x.orderId)===String(m.order)),p=o?product(o.pid):null;title='Koreksi Pesanan yang Sudah Diserahkan';body=`<div class="note yellow"><b>Hanya owner.</b> Koreksi ini mengurangi tagihan sesi dan disimpan sebagai riwayat audit. Stok hanya dikembalikan bila barang fisiknya masih layak dijual.</div><div class="list-row"><span>Item</span><b>${esc(p?.name||'—')} ×${o?.qty||0}</b></div><div class="list-row"><span>Nilai tagihan yang dibatalkan</span><b>${money((o?.price||0)*(o?.qty||0))}</b></div><div class="field"><label>Alasan wajib</label><select id="correction-reason"><option value="">Pilih alasan</option><option>Salah input jumlah pesanan</option><option>Barang dikembalikan belum dibuka</option><option>Kualitas produk tidak sesuai</option><option>Kompensasi / persetujuan owner</option></select></div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="correction-restock"> Barang benar-benar kembali dan layak dijual (restock)</label>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn danger" data-action="confirm-correct-item" data-id="${c?.id||0}" data-order="${m.order}">Simpan Koreksi</button>`;}
else if(m.kind==='stock-adjust'){title='Koreksi / Stok Opname';body=`<div class="note">Koreksi stok disimpan pada audit log. Stok yang berubah harus memiliki alasan dan tetap bisa ditelusuri.</div><div class="field"><label>Produk</label><select id="adjust-product">${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} · Stok sistem ${p.stock}</option>`).join('')}</select></div><div class="field"><label>Jumlah stok fisik baru</label><input id="adjust-stock" type="number" min="0" value="0"></div><div class="field"><label>Alasan</label><select id="adjust-reason"><option>Stock opname</option><option>Barang rusak</option><option>Kedaluwarsa</option><option>Koreksi transaksi</option></select></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="save-stock-adjust">Simpan Koreksi</button>`;}
else if(m.kind==='discount'){title=`Diskon Manual PS3 ${pad(c.id)}`;body=`<div class="note yellow">Hanya owner. Diskon dicatat terpisah dan tidak boleh mengubah tarif dasar transaksi sebelumnya.</div><div class="field"><label>Nominal diskon (Rp)</label><input id="discount-value" type="number" min="0" max="${Math.max(0,calcBill(c).total)}" value="5000"></div><div class="field"><label>Alasan wajib</label><input id="discount-reason" placeholder="Misal kompensasi gangguan TV"></div>`;footer=`<button class="btn ghost" data-action="close-modal">Batal</button><button class="btn" data-action="save-discount" data-id="${c.id}">Terapkan</button>`;}
return `<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="xbtn" data-action="close-modal">×</button></div>${body}<div class="modalactions">${footer}</div></div></div>`;}
function navigate(p){state.page=p;render()}
function act(a,el){const id=Number(el.dataset.id||0);let c=findC(id);const gated=['open-start','confirm-start','extend','confirm-extend','early-stop','checkout','confirm-checkout','cancel-session','confirm-cancel','open-pos','cart-add','cart-dec','submit-pos','confirm-retail','add-expense','confirm-expense'];if(state.role==='kasir'&&!state.shiftActive&&gated.includes(a))return toast('Buka shift kasir terlebih dahulu untuk mengoperasikan billing dan POS.');switch(a){case'choose-role':state.selectedRole=el.dataset.role;render();break;case'login':state.role=state.selectedRole;state.page=state.role==='kasir'?'billing':'overview';record(`${state.role==='kasir'?'Kasir':'Owner'} demo masuk aplikasi`);render();break;case'logout':state.role=null;render();break;case'switch-role':state.role=state.role==='kasir'?'owner':'kasir';state.page=state.role==='kasir'?'billing':'overview';render();break;case'nav':navigate(el.dataset.page);break;case'open-start':state.modal={kind:'start',id};render();break;case'confirm-start':{const minutes=Number(document.getElementById('duration').value),customer=document.getElementById('customer').value.trim();if(c.status!=='available')return toast('Konsol masih memiliki sesi terbuka');Object.assign(c,{status:'active',started:now(),prepUntil:now()+state.settings.prep*60000,prepMinutes:state.settings.prep,end:now()+(minutes+state.settings.prep)*60000,duration:minutes,rate:state.settings.rate,orders:[],customer:customer||`Pelanggan ${id}`,originShiftId:state.activeShiftId,sessionCode:'SESI-'+pad(id)+'-'+String(state.lastActionSeq++)});command(c,true,'mulai billing');track('start',`Mulai billing PS3 ${pad(id)} (${minutes} menit)`,{consoleId:id,originShiftId:state.activeShiftId});record(`PS3 ${pad(id)} sesi dimulai ${minutes} menit berbayar + ${state.settings.prep} menit persiapan gratis, postpaid`,'rental');state.modal=null;render();toast('Billing dimulai; TV ON disimulasikan');break}
case'extend':state.modal={kind:'extend',id};render();break;case'confirm-extend':{if(!c||c.status==='available')return;const minutes=Number(document.getElementById('extend-minutes').value);const restart=c.status==='expired';c.end=(restart?now():c.end)+minutes*60000;c.duration+=minutes;c.status='active';if(restart)command(c,true,'perpanjangan setelah waktu habis');track('extend',`Tambah ${minutes} menit PS3 ${pad(id)}`,{consoleId:id});record(`PS3 ${pad(id)} ditambah ${minutes} menit`,'rental');state.modal=null;render();toast('Durasi diperpanjang dan tagihan diperbarui');break}
case'cancel-session':state.modal={kind:'cancel',id};render();break;
case'confirm-cancel':{if(!c||c.status==='available')return;const reason=document.getElementById('cancel-reason').value;if(!reason)return toast('Pilih alasan pembatalan terlebih dahulu.');if(!cancelEligible(c))return toast('Pembatalan hanya diizinkan selama masa persiapan dan sebelum pesanan tercatat.');command(c,false,'pembatalan billing');track('cancel',`BATAL PS3 ${pad(id)}: ${reason}`,{consoleId:id,reason});record(`BATAL SESI PS3 ${pad(id)} — ${reason} · oleh Kasir Demo · Shift #${state.activeShiftId}`,'warning');Object.assign(c,{status:'available',started:0,prepUntil:0,end:0,duration:0,orders:[],customer:'',tv:'off'});state.modal=null;render();toast('Sesi dibatalkan dan TV OFF disimulasikan; tercatat pada audit log.');break}
case'early-stop':if(c.status!=='active')return;c.status='expired';c.end=now();command(c,false,'sesi ditutup lebih awal');record(`PS3 ${pad(id)} dihentikan lebih awal; tagihan tetap sesuai paket`,'warning');render();break;
case'checkout':state.modal={kind:'checkout',id};render();break;case'detail':state.modal={kind:'detail',id};render();break;
case'confirm-checkout':{if(c.status==='available')return;if(c.orders.some(o=>o.status==='preparing'))return toast('Selesaikan atau batalkan pesanan yang masih disiapkan sebelum pembayaran.');const bill=calcBill(c),method=document.getElementById('pay-method').value;const tender=validateCash(bill.total);if(method!=='Tunai'&&!document.getElementById('verified-payment')?.checked)return toast('Verifikasi penerimaan QRIS/transfer terlebih dahulu.');if(!tender.ok)return toast('Uang tunai yang diterima kurang dari total tagihan.');if(c.status==='active'){c.status='expired';command(c,false,'lunas dan selesai lebih awal')}const trx={id:'TRX-'+String(state.transactions.length+1).padStart(3,'0'),type:c.orders.length?'Rental + POS':'Rental',label:`PS3 ${pad(id)} · ${c.duration} menit${c.orders.length?' + snack':''}`,rental:Math.max(0,bill.rental-(c.discount||0)),pos:bill.snacks,cogs:bill.cogs,amount:bill.total,method,paid:true,time:now(),received:tender.received,change:tender.change,shiftId:state.activeShiftId,originShiftId:c.originShiftId,consoleId:id,duration:c.duration,startedAt:c.started,actor:state.role==='owner'?'Owner Demo':'Kasir Demo',verified:true};state.transactions.unshift(trx);record(`PS3 ${pad(id)} dibayar ${money(bill.total)} (${method})${method==='Tunai'?' · kembalian '+money(tender.change):''}`,'payment');Object.assign(c,{status:'available',started:0,prepUntil:0,end:0,duration:0,orders:[],customer:'',tv:'off'});state.modal=null;render();toast('Pembayaran berhasil dicatat (simulasi)');break}
case'fast':state.clockOffset+=Number(el.dataset.minutes)*60000;checkExpired();render();toast(`Jam simulasi dimajukan ${el.dataset.minutes} menit`);break;
case'open-pos':state.posTarget=String(id);state.ordersCart={};navigate('pos');break;case'pos-cat':state.posCategory=el.dataset.cat;render();break;case'cart-add':{const p=product(id),old=state.ordersCart[id]||0;if(old>=p.stock)return toast('Stok tidak mencukupi');state.ordersCart[id]=old+1;render();break}case'cart-dec':state.ordersCart[id]=Math.max(0,(state.ordersCart[id]||0)-1);render();break;case'clear-cart':state.ordersCart={};render();break;
case'submit-pos':{const total=Object.entries(state.ordersCart).reduce((s,[id,q])=>s+product(id).price*q,0);if(!total)return;if(Object.entries(state.ordersCart).some(([id,q])=>q>product(id).stock))return toast('Stok tidak cukup');if(state.posTarget==='walkin'){state.modal={kind:'retail-pay'};render();}else {const c=findC(state.posTarget);if(!c||c.status==='available')return toast('Sesi tidak lagi tersedia');const fulfillment=document.getElementById('pos-fulfillment')?.value||'handed';Object.entries(state.ordersCart).forEach(([id,q])=>{if(!q)return;const p=product(id);if(fulfillment==='handed'){p.stock-=q;state.stockMovements.unshift({productId:p.id,qty:-q,kind:'penyerahan',at:now(),actor:state.role,shiftId:state.activeShiftId});}c.orders.push({pid:+id,qty:q,price:p.price,cost:p.cost,status:fulfillment,orderId:'P-'+state.lastActionSeq++,actor:state.role==='owner'?'Owner Demo':'Kasir Demo',shiftId:state.activeShiftId,at:now()});});track('order',`Pesanan PS3 ${pad(c.id)} ${money(total)} · ${fulfillment==='handed'?'diserahkan':'sedang disiapkan'}`,{consoleId:c.id});record(`PS3 ${pad(c.id)} tambah pesanan POS ${money(total)} (belum bayar)`,'pos');state.ordersCart={};render();toast('Pesanan masuk ke tagihan PS3; stok berkurang');}break}
case'confirm-retail':{const method=document.getElementById('pay-method').value;let total=0,cogs=0,label=[];Object.entries(state.ordersCart).forEach(([id,q])=>{if(!q)return;const p=product(id);total+=p.price*q;cogs+=p.cost*q;label.push(`${p.name} ×${q}`)});const tender=validateCash(total);if(method!=='Tunai'&&!document.getElementById('verified-payment')?.checked)return toast('Verifikasi QRIS/transfer sebelum konfirmasi.');if(!tender.ok)return toast('Uang tunai tidak mencukupi.');if(Object.entries(state.ordersCart).some(([id,q])=>q>product(id).stock))return toast('Stok sudah tidak cukup.');Object.entries(state.ordersCart).forEach(([id,q])=>{if(q)product(id).stock-=q;});state.transactions.unshift({id:'TRX-'+String(state.transactions.length+1).padStart(3,'0'),type:'POS',label:label.join(', '),rental:0,pos:total,cogs,amount:total,method,paid:true,time:now(),received:tender.received,change:tender.change,shiftId:state.activeShiftId,actor:state.role==='owner'?'Owner Demo':'Kasir Demo',verified:true});record(`Pembeli umum membayar ${money(total)} (${method})`,'payment');state.ordersCart={};state.modal=null;render();toast('Transaksi POS tercatat');break}
case'cash-quick':{const field=document.getElementById('cash-given');if(field){field.value=el.dataset.value;refreshCash();}break}case'trend-period':state.trendPeriod=el.dataset.period;render();break;case'close-modal':state.modal=null;render();break;case'export':{
const head=['ID','Waktu','Jenis','Rincian','Rental','POS','HPP Produk','Total Kas (+/-)','Metode Pembayaran','Shift','Petugas','Diterima Tunai','Kembalian'];
const data=[...state.transactions.map(t=>[t.id,new Date(t.time).toISOString(),t.type,t.label,t.rental,t.pos,t.cogs,t.amount,t.method,t.shiftId||'',t.actor||'',t.method==='Tunai'?(t.received??t.amount):'',t.method==='Tunai'?(t.change??0):'']),...(state.role==='owner'?state.expense.map((e,i)=>[`EXP-${i+1}`,new Date(e.at).toISOString(),'Pengeluaran Kas',`${e.name} (${e.category||'Lainnya'})`,0,0,0,-e.value,'Tunai (kas keluar)',e.shiftId||'',e.actor||'',-e.value,'']):[])];
const csv=[head,...data].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='laporan_pembayaran_dan_kas_ps3_demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Laporan CSV berhasil disiapkan');break}
case'toggle-shift':{if(state.shiftActive){state.modal={kind:'blindcash'};render();}else{const last=currentShift();if(last&&last.employee==='Owner Demo'&&!last.ended){last.ended=now();last.countedTotal=getCashExpected(last);last.cashDiff=0;}state.shiftSeq+=1;state.activeShiftId=state.shiftSeq;state.cashOpen=last?.countedTotal??(last?getCashExpected(last):state.cashOpen);state.shiftRecords.push({id:state.activeShiftId,employee:'Kasir Demo',started:now(),ended:null,cashOpen:state.cashOpen});state.shiftActive=true;track('shift','Karyawan membuka Shift #'+state.activeShiftId);record(`Shift #${state.activeShiftId} ON · ${fmtFull(now())}`,'shift');render();toast('Shift karyawan aktif; billing dan POS dapat digunakan.');}break}case'add-expense':state.modal={kind:'expense'};render();break;case'confirm-expense':{const name=document.getElementById('ex-name').value.trim(),value=+document.getElementById('ex-value').value;if(!name||value<=0)return toast('Isi nama dan nominal pengeluaran');const proof=document.getElementById('ex-proof')?.value.trim()||'',category=document.getElementById('ex-cat').value;if(value>25000&&!proof)return toast('Untuk pengeluaran di atas Rp25.000 isi bukti/nomor nota.');const expense={id:state.expenseSeq++,name,value,category,proof,at:now(),shiftId:state.activeShiftId,actor:state.role==='owner'?'Owner Demo':'Kasir Demo'};if(value>100000&&state.role!=='owner'){expense.status='pending';state.pendingExpenses.unshift(expense);track('approval',`Pengeluaran ${money(value)} menunggu persetujuan owner: ${name}`);record(`Pengajuan kas keluar ${money(value)}: ${name}`,'warning');}else{state.expense.unshift(expense);track('expense',`Kas keluar ${money(value)}: ${name}`);record(`Kas keluar ${money(value)}: ${name}`,'shift');}state.modal=null;render();break}
case'restock':state.modal={kind:'restock',id};render();break;case'confirm-restock':{const count=+document.getElementById('restock-count').value;if(count<1)return toast('Jumlah stok tidak valid');product(id).stock+=count;record(`Stok ${product(id).name} bertambah ${count}`,'inventory');state.modal=null;render();break}
case'add-product':state.modal={kind:'product'};render();break;case'edit-product':state.modal={kind:'product',id};render();break;case'confirm-product':{const name=document.getElementById('prd-name').value.trim(),cat=document.getElementById('prd-cat').value,price=+document.getElementById('prd-price').value,cost=+document.getElementById('prd-cost').value,stock=+document.getElementById('prd-stock').value;if(!name||price<=0||cost<0||stock<0)return toast('Periksa input produk');const expires=document.getElementById('prd-exp')?.value||'';if(id){const p=product(id),oldPrice=p.price,oldStock=p.stock;Object.assign(p,{name,cat,price,cost,stock,expires});if(oldPrice!==price||oldStock!==stock)track('product',`Produk ${name}: harga ${money(oldPrice)} → ${money(price)}; stok ${oldStock} → ${stock}`);}else{const newId=Math.max(...state.products.map(p=>p.id))+1;state.products.push({id:newId,name,cat,price,cost,stock,expires,min:5,icon:categoryIcon(cat)});track('product',`Produk baru: ${name}`);}record(`Katalog produk diperbarui: ${name}`,'inventory');state.modal=null;render();break}
case'device-test':command(c,el.dataset.status==='on','uji manual perangkat');render();toast('Perintah TV hanya disimulasikan');break;case'save-settings':{const rate=+document.getElementById('set-rate').value,warn=+document.getElementById('set-warn').value;const prep=+document.getElementById('set-prep').value;if(rate<500||warn<1||warn>30||prep<0||prep>20)return toast('Input pengaturan tidak valid');state.settings={rate,warn,prep};record(`Pengaturan harga ${money(rate)}/jam, peringatan ${warn} menit`,'settings');render();toast('Pengaturan demo disimpan');break}
case'confirm-blindcash':{if(!state.shiftActive)return toast('Shift karyawan sudah ditutup.');let counted=0;for(const n of document.querySelectorAll('[data-denom]')){const q=Number(n.value);if(!Number.isInteger(q)||q<0)return toast('Jumlah lembar uang harus bilangan bulat nonnegatif.');counted+=Number(n.dataset.denom)*q;}if(!confirm('Kirim hasil hitung kas fisik '+money(counted)+' dan tutup shift? Setelah dikirim, hasil pertama tersimpan.'))break;const sh=currentShift(),exp=getCashExpected(sh);sh.countedTotal=counted;sh.cashDiff=counted-exp;sh.countNote=document.getElementById('cash-note')?.value||'';sh.ended=now();track('blindcash',`Shift #${sh.id}: fisik ${money(counted)}, teoritis ${money(exp)}, selisih ${money(sh.cashDiff)}`,{shiftId:sh.id});state.shiftActive=false;record(`Shift #${sh.id} OFF · ${fmtFull(now())} · kas fisik ${money(counted)} · selisih ${money(sh.cashDiff)}`,'shift');state.shiftSeq++;state.activeShiftId=state.shiftSeq;state.cashOpen=counted;state.shiftRecords.push({id:state.activeShiftId,employee:'Owner Demo',started:now(),ended:null,cashOpen:counted});track('shift','Owner mengambil alih dari karyawan · shift #'+state.activeShiftId);state.modal=null;render();toast('Shift karyawan selesai; owner mengambil alih operasional.');break}
case'audit-resolve':state.auditReviews[el.dataset.key]='resolved';track('audit','Temuan '+el.dataset.key+' ditandai selesai owner');render();break;
case'audit-reopen':delete state.auditReviews[el.dataset.key];track('audit','Temuan '+el.dataset.key+' dibuka kembali');render();break;
case'tx-period':state.txPeriod=el.dataset.period;if(state.txPeriod==='custom'&&!state.txDate)state.txDate=fmtYMD(now());render();break;
case'audit-period':state.auditPeriod=el.dataset.period;if(state.auditPeriod==='custom'&&!state.auditDate)state.auditDate=fmtYMD(now());render();break;
case'owner-money':if(state.role!=='owner')return;state.modal={kind:'owner-money'};render();break;
case'save-owner-money':{if(state.role!=='owner')return;const kind=document.getElementById('om-kind').value,amount=+document.getElementById('om-value').value,note=document.getElementById('om-note').value.trim();if(!Number.isFinite(amount)||amount<=0||!note)return toast('Isi nominal dan keterangan.');const m={id:state.ownerMovements.length+1,kind,amount,note,at:now(),method:'Tunai',shiftId:state.activeShiftId};state.ownerMovements.unshift(m);track('owner-money',`${kind==='setoran'?'Setoran modal':kind==='prive'?'Prive':'Setor ke bank'} ${money(amount)} — ${note}`);record('Mutasi owner '+money(amount),'shift');state.modal=null;render();break}
case'approve-expense':{if(state.role!=='owner')return;const ix=state.pendingExpenses.findIndex(e=>e.id===id);if(ix<0)return;const e=state.pendingExpenses.splice(ix,1)[0];e.status='approved';e.approvedAt=now();e.requestShiftId=e.shiftId;e.shiftId=state.activeShiftId;e.at=now();state.expense.unshift(e);track('approval',`Owner menyetujui pengeluaran ${money(e.value)}: ${e.name}`);render();break}
case'reject-expense':{if(state.role!=='owner')return;const ix=state.pendingExpenses.findIndex(e=>e.id===id);if(ix<0)return;const e=state.pendingExpenses.splice(ix,1)[0];track('approval',`Owner menolak pengeluaran ${money(e.value)}: ${e.name}`);render();break}
case'day-close':if(state.role!=='owner')return;state.modal={kind:'dayclose'};render();break;
case'confirm-day-close':{if(state.role!=='owner')return;const date=businessDay(now());if(state.dayClosures.some(x=>x.businessDate===date))return toast('Hari bisnis ini sudah pernah difinalkan.');const tx=state.transactions.filter(t=>businessDay(t.time)===date),ex=state.expense.filter(e=>businessDay(e.at)===date);const snap={businessDate:date,at:now(),actor:'Owner Demo',received:tx.reduce((a,t)=>a+t.amount,0),rental:tx.reduce((a,t)=>a+t.rental,0),pos:tx.reduce((a,t)=>a+t.pos,0),spending:ex.reduce((a,e)=>a+e.value,0),unpaid:unpaid(),note:document.getElementById('dayclose-note')?.value||''};state.dayClosures.unshift(snap);track('eod','Tutup hari bisnis '+date+' difinalkan owner');state.modal=null;render();toast('Snapshot laporan tutup hari disimpan pada demo.');break}
case'stock-adjust':if(state.role!=='owner')return;state.modal={kind:'stock-adjust'};render();break;
case'save-stock-adjust':{if(state.role!=='owner')return;const p=product(document.getElementById('adjust-product').value),newStock=+document.getElementById('adjust-stock').value,reason=document.getElementById('adjust-reason').value;if(!p||!Number.isInteger(newStock)||newStock<0)return toast('Jumlah stok harus bilangan bulat nonnegatif.');const old=p.stock;p.stock=newStock;state.stockMovements.unshift({productId:p.id,qty:newStock-old,kind:reason,at:now(),actor:'Owner Demo'});track('stock',`Stok ${p.name} ${old} → ${newStock} (${reason})`);state.modal=null;render();break}
case'handover-pos':{if(state.role==='kasir'&&!state.shiftActive)return toast('Shift kasir harus aktif.');const o=c?.orders.find(x=>String(x.orderId)===el.dataset.order);if(!o||o.status!=='preparing')return toast('Pesanan sudah diproses.');const p=product(o.pid);if(p.stock<o.qty)return toast('Stok tidak cukup untuk penyerahan.');p.stock-=o.qty;o.status='handed';o.handedAt=now();state.stockMovements.unshift({productId:p.id,qty:-o.qty,kind:'penyerahan',at:now(),actor:state.role});track('handover',`${p.name} ×${o.qty} diserahkan pada PS3 ${pad(id)}`);render();break}
case'cancel-pos-pending':{const index=c?.orders.findIndex(x=>String(x.orderId)===el.dataset.order);if(index<0)return;const o=c.orders[index];if(o.status!=='preparing')return toast('Barang yang sudah diserahkan membutuhkan koreksi owner.');if(!confirm('Batalkan item yang masih disiapkan?'))break;c.orders.splice(index,1);track('order-cancel',`Pesanan belum diserahkan dibatalkan: ${product(o.pid).name} ×${o.qty}, PS3 ${pad(id)}`);render();break}
case'discount':if(state.role!=='owner')return;state.modal={kind:'discount',id};render();break;
case'save-discount':{if(state.role!=='owner')return;const val=+document.getElementById('discount-value').value,reason=document.getElementById('discount-reason').value.trim();if(!reason||val<0||val>calcBill(c).total)return toast('Periksa nominal dan alasan diskon.');const old=c.discount||0;c.discount=old+val;track('discount',`Owner memberi diskon ${money(val)} pada PS3 ${pad(id)}: ${reason}`);state.modal=null;render();break}
case'verify-shift':{if(state.role!=='owner')return;const sh=shiftFor(id);if(!sh||!sh.ended||sh.verifiedAt)return;sh.verifiedAt=now();sh.verifiedBy='Owner Demo';track('shift-verify',`Owner menerima serah terima Shift #${id}: kas fisik ${money(sh.countedTotal||0)}; selisih ${money(sh.cashDiff||0)}`);render();break}
case'correct-item':{if(state.role!=='owner')return;state.modal={kind:'correct-item',id,order:el.dataset.order};render();break}
case'confirm-correct-item':{if(state.role!=='owner')return;const orderId=el.dataset.order,ix=c?.orders.findIndex(o=>String(o.orderId)===orderId),reason=document.getElementById('correction-reason')?.value;if(ix==null||ix<0||!reason)return toast('Pilih alasan koreksi.');const o=c.orders[ix],p=product(o.pid),back=!!document.getElementById('correction-restock')?.checked;if(back){p.stock+=o.qty;state.stockMovements.unshift({productId:p.id,qty:o.qty,kind:'barang kembali layak jual',at:now(),actor:'Owner Demo'});}c.orders.splice(ix,1);track('order-correction',`Owner koreksi ${p.name} ×${o.qty} pada PS3 ${pad(id)}; ${reason}; stok ${back?'dikembalikan':'tidak dikembalikan'}`,{consoleId:id});state.modal=null;render();break}
case'device-heartbeat':{if(state.role!=='owner')return;const k=String(id);state.deviceOnline[k]=state.deviceOnline[k]===false?true:false;track('device',`Simulasi ESP32 ${pad(id)} ${state.deviceOnline[k]===false?'offline':'online'}`);render();break}
case'reset-demo':location.reload();break;
}}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;act(el.dataset.action,el)});
app.addEventListener('change',e=>{if(e.target.id==='pos-target'){state.posTarget=e.target.value;render()}if(e.target.id==='pay-method')refreshCash();if(e.target.id==='tx-date'){state.txDate=e.target.value;render()}if(e.target.id==='audit-date'){state.auditDate=e.target.value;render()}});
app.addEventListener('input',e=>{if(e.target.id==='cash-given')refreshCash();if(e.target.matches('[data-denom]')){let tot=0;document.querySelectorAll('[data-denom]').forEach(el=>tot+=(Number(el.dataset.denom)||0)*Math.max(0,Number(el.value)||0));const t=document.getElementById('blind-total');if(t)t.textContent=money(tot);}if(e.target.id==='prod-search'){const start=e.target.selectionStart;state.posSearch=e.target.value;render();const el=document.getElementById('prod-search');if(el){el.focus();el.setSelectionRange(start,start)}}});
function tick(){if(!state.role)return;checkExpired();document.querySelectorAll('[data-timer]').forEach(el=>{const c=findC(el.dataset.timer);if(c&&c.status==='active')el.textContent=countdownText(countdown(c))});document.querySelectorAll('[data-prep]').forEach(el=>{const c=findC(el.dataset.prep);if(c&&c.status==='active'){const prepLeft=Math.max(0,Math.ceil((c.prepUntil-now())/1000));el.textContent=countdownText(prepLeft);const label=document.querySelector(`[data-timer-label="${c.id}"]`);if(label)label.textContent=prepLeft?'Persiapan gratis · sebelum waktu rental dimulai':'Waktu bermain berbayar dimulai';if(prepLeft<=0)render();}});const clock=document.getElementById('clock');if(clock)clock.textContent=fmtTime(now());}
record('Sistem billing siap · 6 konsol dan 6 pengendali TV simulasi','system');render();setInterval(tick,1000);
})();
